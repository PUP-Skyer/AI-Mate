server {
    listen 80;
    server_name localhost;

    # 前端主应用
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue 子应用
    location /community {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
    }

    location /resource {
        proxy_pass http://localhost:3002;
        proxy_set_header Host $host;
    }

    location /dashboard {
        proxy_pass http://localhost:3003;
        proxy_set_header Host $host;
    }

    location /user {
        proxy_pass http://localhost:3004;
        proxy_set_header Host $host;
    }

    # React 子应用
    location /ai-chat {
        proxy_pass http://localhost:4001;
        proxy_set_header Host $host;
    }

    location /bp-gen {
        proxy_pass http://localhost:4002;
        proxy_set_header Host $host;
    }

    location /collab {
        proxy_pass http://localhost:4003;
        proxy_set_header Host $host;
    }

    # 子应用静态资源（qiankun UMD）
    location ~ ^/(vue-community|vue-resource|vue-dashboard|vue-user|react-ai-chat|react-bp-gen|react-collab)/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
    }

    # 后端 API（保留 /api 前缀，后端 Controller 使用 @RequestMapping("/api/...")）
    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 文件上传大小限制
        client_max_body_size 50m;
    }

    # AI 代理层（保留 /ai 前缀，serverless-proxy 路由为 /ai/...）
    location /ai/ {
        proxy_pass http://localhost:9000/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE 流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Swagger API 文档
    location /swagger-ui/ {
        proxy_pass http://localhost:8080/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://localhost:8080/v3/api-docs;
        proxy_set_header Host $host;
    }
}
